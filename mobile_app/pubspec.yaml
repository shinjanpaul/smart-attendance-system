name: veriface_smart_attendance
description: "VeriFace AI • Modern Smart Attendance Mobile Application with Supabase Cloud"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Cloud Client (100% Free PostgreSQL, Auth, Realtime, Storage)
  supabase_flutter: ^2.5.6

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # Camera & Biometric Photo Capture
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # Offline Persistence
  shared_preferences: ^2.2.3

  # UI Enhancement & Cupertino Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
